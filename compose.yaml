services:
  schulmanager-sync:
    image: ghcr.io/g3gg0/schmgrcalsync:latest
    environment:
      SCHULMANAGER_USERNAME: ${SCHULMANAGER_USERNAME:?Set in Portainer stack environment}
      SCHULMANAGER_PASSWORD: ${SCHULMANAGER_PASSWORD:?Set in Portainer stack environment}
      SCHULMANAGER_STUDENT_ID: ${SCHULMANAGER_STUDENT_ID:-}
      SCHULMANAGER_STUDENT: ${SCHULMANAGER_STUDENT:-1}
      SCHULMANAGER_INSTITUTION_ID: ${SCHULMANAGER_INSTITUTION_ID:-}
      GOOGLE_CALENDAR_ICAL_URL: ${GOOGLE_CALENDAR_ICAL_URL:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      SYNC_WEEKS: ${SYNC_WEEKS:-26}
      SYNC_HOURS: ${SYNC_HOURS:-4}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Berlin}
      SYNC_REMIND_DAYS: ${SYNC_REMIND_DAYS:-}
      SYNC_PREFIX_STUDENT_NAME: ${SYNC_PREFIX_STUDENT_NAME:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SYNC_DB_PATH: /data/sync.sqlite
      SYNC_SESSION_PATH: /data/schulmanager-session.json
    volumes:
      - sync-data:/data
    command: ["--daemon"]
    restart: unless-stopped
    init: true

volumes:
  sync-data:
